name: supabase-production

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to release (branch, tag, or commit sha)"
        required: true
        default: "main"
  push:
    tags:
      - "release/**"

jobs:
  production:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PROD }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
      ENABLE_DB_RESET: "0"
      ENABLE_SYNC_BRANCH: "0"
      ENABLE_DEPLOY_ALL_FUNCTIONS: "1"
      ENABLE_DEPLOY_FUNCTION: "1"
      ENABLE_DB_PUSH: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_ref || github.ref }}
          fetch-depth: 0

      - name: Validate release tag ancestry
        if: startsWith(github.ref, 'refs/tags/release/')
        run: |
          git fetch origin main
          if git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Release tag commit is contained in main."
          else
            echo "Release tag commit is not contained in main. Abort."
            exit 1
          fi

      - name: Install Supabase CLI
        run: |
          curl -fsSL https://supabase.com/install.sh | sh
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Supabase Login
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: Run TDD tests for all functions
        run: ./build.sh "$SUPABASE_PROJECT_REF" test-functions all

      - name: Push migrations to production
        run: ./build.sh "$SUPABASE_PROJECT_REF" db-push

      - name: Deploy functions to production
        run: ./build.sh "$SUPABASE_PROJECT_REF" deploy-functions-all
